{% extends "base.html" %}{% block title %}Request blood · BloodBridge{% endblock %}{% block body %}
<div class="card"><h1 style="font-size:40px">Request blood</h1><p class="note">For emergencies call 112 or contact the hospital blood bank first. We help find volunteer donors, and cannot guarantee a match.</p>
{% if err %}<p class="err" role="alert">{{ err }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label>Your name<input name="name" maxlength="60" value="{{ f.name }}" required></label>
<label>Mobile number<input name="phone" inputmode="tel" value="{{ f.phone }}" required></label>
<label>Blood group needed<select name="bgroup">{% for g in GROUPS %}<option{{ ' selected' if f.bgroup==g }}>{{ g }}</option>{% endfor %}</select></label>
<label>City or hospital location<input name="city" maxlength="40" value="{{ f.city }}" required></label>
<label>Units needed<input name="units" type="number" min="1" max="10" value="{{ f.units or 1 }}" required></label>
<label>Note (optional, no medical details)<textarea name="note" maxlength="200" rows="3">{{ f.note }}</textarea></label>
<label class="chk"><input type="checkbox" name="urgent">This is urgent</label>
<label class="chk"><input type="checkbox" name="consent">I agree that BloodBridge may store these details and share my number with a matching donor. <a href="/privacy">Privacy</a></label>
<button>Send request</button></form></div>{% endblock %}
